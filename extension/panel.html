<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTP Bridge</title><link rel="stylesheet" href="panel.css"></head>
<body>
<header><span class="mark" aria-hidden="true">↳</span><strong>OTP Bridge</strong><span id="state" class="state"></span></header>

<section id="setup" hidden>
  <h1>Connect your bridge</h1>
  <form id="connect-form">
    <label>Bridge address<input id="bridge" type="url" placeholder="https://your-bridge.example" required></label>
    <label>Browser key<input id="token" type="password" autocomplete="off" minlength="32" required></label>
    <button type="submit">Connect</button>
  </form>
  <p class="fine">Saved in this Chrome profile only. Disconnect removes it.</p>
</section>

<section id="home" hidden>
  <div class="saved"><span class="eyebrow">TIME SAVED</span><b id="saved-total">0s</b><span id="saved-note" class="fine"></span></div>
  <div class="site"><span id="site-dot" class="dot"></span><span id="site">No website open</span></div>
  <div class="list-head"><h2>Codes</h2><span class="fine">last 10 min</span></div>
  <div id="results"></div>
  <p id="empty" class="empty">No codes yet. They show up here, and fill themselves on the page.</p>

  <details>
    <summary>Settings</summary>
    <label class="switch"><span>Fill codes on every site<small>One-time Chrome permission</small></span><input id="everywhere" type="checkbox"></label>
    <label class="switch"><span>Press Verify after filling<small>Only when there is one clear button</small></span><input id="auto-submit" type="checkbox"></label>
    <label class="switch"><span>Play a sound when a code fills</span><input id="sound" type="checkbox"></label>
    <label class="switch"><span>Alert me when a code arrives</span><input id="alerts" type="checkbox"></label>
    <label class="row">Payment codes<select id="payment-mode"><option value="">Keep manual</option><option value="fill">Fill</option><option value="submit">Fill and submit</option></select></label>
    <details class="nested">
      <summary>Not matching on this site?</summary>
      <label>Name in the message<input id="auto-service" maxlength="100" placeholder="Blinkit"></label>
      <label>Arrives by<select id="auto-channel"><option value="sms">SMS</option><option value="email">Email</option></select></label>
      <label>Email address (for email codes)<input id="auto-account" type="email"></label>
      <div class="pair"><button id="enable-auto" type="button">Save for this site</button><button id="disable-auto" class="ghost" type="button">Never on this site</button></div>
    </details>
    <button id="disconnect" class="link" type="button">Disconnect bridge</button>
  </details>
</section>

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="panel.js"></script>
</body></html>
